name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build -c release
      - run: swift test
      - name: self test (silent, built-in output)
        run: swift build && MIX741_SELFTEST=1 MIX741_NOEXT=1 .build/debug/minos741 2>&1 | tail -40 | tee selftest.log && grep -q "SELFTEST OK" selftest.log
      - name: ui test (offscreen, fixture collection, silent)
        if: ${{ !cancelled() }}
        run: scripts/uitest.sh --fixture
