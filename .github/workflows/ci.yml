name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build -c release
      - run: swift test
      - name: ui test (offscreen, fixture collection, silent)
        if: ${{ !cancelled() }}
        run: scripts/uitest.sh --fixture
